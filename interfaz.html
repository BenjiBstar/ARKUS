<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>ARKUS</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 0; }
        .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { display: none !important; }

        /* 1. BARRA SUPERIOR (Sintaxis calc() corregida) */
        #hud-barra-superior { 
            box-sizing: border-box; position: absolute; width: calc(100% - 280px); left: 280px; top: 0px; height: 43px; 
            background: rgba(117, 114, 114, 0.4); border: 1px solid rgba(255, 255, 255, 0.3); border-left: none;
            backdrop-filter: blur(7.5px); -webkit-backdrop-filter: blur(7.5px); 
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.4); z-index: 10; 
        }
        .hud-barra-contenido { display: flex; align-items: center; justify-content: space-around; height: 100%; color: #ffffff; font-family: 'Consolas', monospace; font-size: 15px; padding: 0 20px; }
        .hud-dato-etiqueta { color: #a0aab5; margin-right: 8px; pointer-events: none; }
        .hud-dato-valor { color: #00c8ff; font-weight: bold; pointer-events: none; }
        .hud-item-clic { display: flex; align-items: center; cursor: pointer; padding: 4px 10px; border-radius: 4px; transition: background 0.2s; }
        .hud-item-clic:hover { background: rgba(255, 255, 255, 0.15); }
        

        #hud-explicacion {
            box-sizing: border-box; position: absolute; width: 680px; max-width: calc(100vw - 340px); left: 300px; top: 52px;   
            background: rgba(117, 114, 114, 0.4); border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(7.5px); -webkit-backdrop-filter: blur(7.5px);
            box-shadow: 0px 6px 25px rgba(0, 0, 0, 0.7); z-index: 15; color: white;
            font-family: 'Consolas', monospace; font-size: 13.5px; line-height: 1.55; 
            padding: 22px 35px 22px 25px; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease-in-out; 
        }
        #hud-explicacion.visible { opacity: 1; pointer-events: auto; }

        /* Botón de cierre posicionado de forma armónica y separado de los bordes */
        #hud-explicacion .btn-cerrar {
            position: absolute; top: 15px; right: 15px; 
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.35); 
            color: #ffffff; cursor: pointer; font-size: 13px; width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center; transition: 0.2s; z-index: 2;
        }
        #hud-explicacion .btn-cerrar:hover { 
            background: rgba(255, 0, 0, 0.6); border-color: #ff2a2a; 
        }

        /* 2. MENÚ LATERAL IZQUIERDO */
        #hud-lateral-izquierdo { 
            box-sizing: border-box; position: absolute; width: 280px; left: 0px; top: 0px; bottom: 0px; 
            height: 100vh; background: rgba(117, 114, 114, 0.4); border: 1px solid rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(7.5px); -webkit-backdrop-filter: blur(7.5px); z-index: 12; 
            display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; 
            box-shadow: 4px 0px 15px rgba(0, 0, 0, 0.5); -ms-overflow-style: none; scrollbar-width: none; 
        }
        #hud-lateral-izquierdo::-webkit-scrollbar { display: none; }

        .hud-cabecera { padding: 20px 25px 10px 25px; }
        .titulo-bandera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .hud-cabecera h1 { font-family: 'Roboto Mono', 'Consolas', monospace; font-weight: 600; font-size: 24px; line-height: 1.4; color: #FFFFFF; margin: 0; }
        .hud-cabecera p { font-family: 'Consolas', monospace; font-size: 15px; color: #ffffff; margin: 0; margin-top: 15px; text-align: center; }
        .bandera-hud { width: 65px; height: auto; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 2px; box-shadow: 0px 0px 12px rgba(0, 200, 255, 0.2); object-fit: cover; }

        .seccion-menu { padding: 10px 20px; position: relative; }
        .seccion-menu h3 { font-family: 'Consolas', monospace; font-weight: normal; font-size: 16px; color: #FFFFFF; margin: 0 0 8px 0; text-align: center; }
        
        .btn-toggle { 
            width: 100%; display: flex; align-items: center; justify-content: space-between; 
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.4); 
            color: #ffffff; padding: 11px 15px; text-align: left; border-radius: 0px; 
            cursor: pointer; font-family: 'Consolas', monospace; font-size: 14px; 
            margin-bottom: -1px; transition: all 0.2s ease; box-sizing: border-box;
        }
        .btn-toggle:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-toggle.activo { background: #d9e6f2; border: 1px solid rgba(255, 255, 255, 0.8); color: #000000; position: relative; z-index: 1; font-weight: bold; }

        .btn-contenido { display: flex; align-items: center; gap: 12px; }
        .btn-contenido svg { width: 18px; height: 18px; flex-shrink: 0; object-fit: contain; }

        .btn-desplegable::after { content: ' ▸'; font-size: 12px; opacity: 0.7; }
        .btn-desplegable.activo::after { content: ' ▾'; }
        
        .submenu-flotante {
            display: none; position: fixed; left: 280px; width: 280px; background: rgba(117, 114, 114, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.3); border-left: none; 
            backdrop-filter: blur(7.5px); -webkit-backdrop-filter: blur(7.5px); 
            box-shadow: 4px 0px 15px rgba(0, 0, 0, 0.5); z-index: 9999; padding: 10px 20px; margin: 0; box-sizing: border-box;
        }
        .submenu-flotante.abierto { display: block; }
        
        .submenu-btn {
            width: 100%; display: flex; align-items: center; gap: 15px; background: transparent; 
            border: 1px solid rgba(255, 255, 255, 0.4); color: #ffffff; padding: 11px 15px; text-align: left; 
            border-radius: 0px; cursor: pointer; font-family: 'Consolas', monospace; font-size: 14px; 
            margin-bottom: -1px; transition: all 0.2s ease; box-sizing: border-box;
        }
        .submenu-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .submenu-btn.activo { background: #d9e6f2; border: 1px solid rgba(255, 255, 255, 0.8); color: #000000; position: relative; z-index: 1; font-weight: bold; }

        /* 3. PANEL DERECHO AUTO-ADAPTABLE, CENTRADO Y CON SCROLL LIMPIO (No choca con HUD inferior) */
        #panel-derecho { 
            box-sizing: border-box; position: absolute; width: 380px; right: 20px; 
            top: 48%; transform: translateY(-50%);
            height: fit-content; max-height: calc(100vh - 135px); 
            background: rgba(117, 114, 114, 0.4); border: 1px solid rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(7.5px); -webkit-backdrop-filter: blur(7.5px); 
            box-shadow: 0px 0px 25px rgba(0, 0, 0, 0.65); z-index: 11; 
            display: flex; flex-direction: column; padding: 28px 25px 22px 25px; 
            color: white; font-family: 'Consolas', monospace; 
            overflow-y: auto; overflow-x: hidden;
            opacity: 0; pointer-events: none; 
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out; 
            scrollbar-width: thin; scrollbar-color: rgba(0, 200, 255, 0.5) rgba(0, 0, 0, 0.2);
        }
        /* Separación entre las líneas verticales y el texto + aire tipográfico en todos los Hubs */
        #panel-derecho .intel-parrafo {
            line-height: 1.68 !important;
            letter-spacing: 0.35px !important;
            margin-bottom: 14px !important;
        }
        /* Detecta cualquier bloque con línea vertical izquierda y despega el texto 14px */
        #panel-derecho [style*="border-left"] {
            padding-left: 14px !important;
            padding-right: 10px !important;
            line-height: 1.65 !important;
            letter-spacing: 0.35px !important;
            border-radius: 0 3px 3px 0;
        }
        #panel-derecho .intel-campo {
            letter-spacing: 0.4px !important;
            line-height: 1.5 !important;
            margin-bottom: 15px !important;
        }
        #panel-derecho .intel-titulo {
            letter-spacing: 0.8px !important;
            line-height: 1.35 !important;
            margin-bottom: 16px !important;
        }
        #panel-derecho::-webkit-scrollbar { width: 5px; }
        #panel-derecho::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        #panel-derecho::-webkit-scrollbar-thumb { background: rgba(0, 200, 255, 0.5); border-radius: 3px; }
        #panel-derecho.visible { opacity: 1; pointer-events: auto; }

        .btn-cerrar { position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff; cursor: pointer; font-size: 14px; padding: 4px 8px; transition: 0.2s; z-index: 2; }
        .btn-cerrar:hover { background: rgba(255, 0, 0, 0.6); border-color: #ff2a2a; }

        .intel-titulo { font-family: 'Consolas', monospace; font-size: 21px; color: #ffffff; text-align: center; margin: 0 0 18px 0; font-weight: normal; padding-right: 15px; }
        .intel-parrafo { font-size: 14px; line-height: 1.55; color: #ffffff; margin-bottom: 12px; text-align: left; }
        .intel-campo { margin-bottom: 12px; font-size: 15px; color: #ffffff; text-align: center; }
        .intel-etiqueta { color: #a0aab5; font-size: 13px; }

        /* 4. HUD INFERIOR UNIFICADO AL MISMO COLOR Y ESTILO DEL RESTO DE HUDS */
        #hud-inferior-leyenda {
            box-sizing: border-box; position: absolute; bottom: 0px; left: 280px; width: calc(100% - 280px);
            min-height: 43px;
            background: rgba(117, 114, 114, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.3); border-left: none; border-bottom: none;
            backdrop-filter: blur(7.5px); -webkit-backdrop-filter: blur(7.5px); 
            box-shadow: 0px -4px 15px rgba(0, 0, 0, 0.4); z-index: 10;
            display: flex; justify-content: center; align-items: center; gap: 20px;
            padding: 10px 20px; color: #ffffff; font-family: 'Consolas', monospace; font-size: 13px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; overflow-x: auto;
            scrollbar-width: none;
        }
        #hud-inferior-leyenda::-webkit-scrollbar { display: none; }
        #hud-inferior-leyenda.visible { opacity: 1; pointer-events: auto; }
        .leyenda-grupo { display: flex; align-items: center; gap: 15px; border-right: 1px solid rgba(255, 255, 255, 0.3); padding-right: 20px; white-space: nowrap; }
        .leyenda-grupo:last-child { border-right: none; padding-right: 0; }
        .leyenda-titulo { color: #00c8ff; font-size: 12px; text-transform: uppercase; margin-right: 5px; font-weight: bold; }
        .simbolo-linea { display: inline-block; width: 25px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
        .simbolo-punto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 5px; border: 1px solid rgba(255,255,255,0.5); }
        .simbolo-dash { display: inline-block; width: 25px; height: 2px; border-top: 2px dashed; vertical-align: middle; margin-right: 5px; }

        /* 5. NUEVO: VISTAZO RÁPIDO TÁCTICO AL PASAR EL CURSOR (TOOLTIP) */
        #hud-tooltip {
            position: fixed; pointer-events: none; z-index: 99999;
            background: rgba(20, 24, 30, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-left: 3px solid #00c8ff;
            backdrop-filter: blur(7.5px); -webkit-backdrop-filter: blur(7.5px);
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.7);
            padding: 8px 12px; color: #ffffff;
            font-family: 'Consolas', monospace; font-size: 12px; line-height: 1.4;
            max-width: 290px; opacity: 0; transition: opacity 0.12s ease;
        }
        #hud-tooltip.visible { opacity: 1; }
        .tt-categoria { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #a0aab5; display: block; margin-bottom: 2px; }
        .tt-nombre { font-size: 13px; font-weight: bold; color: #ffffff; display: block; }
        .tt-relevancia { font-size: 11px; font-weight: bold; display: inline-block; margin-top: 4px; padding: 2px 6px; background: rgba(0, 0, 0, 0.45); }

        .intel-heraldica-container { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 18px; width: 100%; }
        .intel-img-logo { height: 85px; width: auto; max-width: 105px; object-fit: contain; filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.15)); }
        .marco-bandera {
            display: block; height: 60px; width: max-content; max-width: 190px; border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 0px; overflow: hidden; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5); background-color: #000;   
        }
        .intel-img-foto { display: block; height: 100%; width: auto; object-fit: cover; border: none; }
    </style>
</head>
<body>

<div id="hud-barra-superior"></div>
<div id="hud-explicacion"></div>
<div id="hud-tooltip"></div>
<div id="map"></div>
<div id="hud-inferior-leyenda"></div>

<script>
    function cerrarPanelIntel() {
        document.getElementById('panel-derecho').classList.remove('visible');

    function actualizarLeyendasHUD() {
        const hud = document.getElementById('hud-inferior-leyenda');
        let contenidoHTML = '';

        if (document.getElementById('btn-sub-alta-tension') && document.getElementById('btn-sub-alta-tension').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Red SADI:</span><div><span class="simbolo-linea" style="background:#ff2a2a;"></span> 500 kV (Nivel 1)</div><div><span class="simbolo-linea" style="background:#ffaa00;"></span> 220/330 kV</div><div><span class="simbolo-linea" style="background:#00c8ff;"></span> 132/66 kV</div></div>`;
        }
        if (document.getElementById('btn-sub-gen-electrica') && document.getElementById('btn-sub-gen-electrica').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Matriz de Generación:</span><div><span class="simbolo-punto" style="background:#00ff00;"></span> Nuclear</div><div><span class="simbolo-punto" style="background:#00c8ff;"></span> Hidroeléctrica</div><div><span class="simbolo-punto" style="background:#ff4444;"></span> Térmica</div><div><span class="simbolo-punto" style="background:#ccffff;"></span> Eólica</div><div><span class="simbolo-punto" style="background:#ffcc00;"></span> Solar</div></div>`;
        }
        if (document.getElementById('btn-sub-gasoductos') && document.getElementById('btn-sub-gasoductos').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Infraestructura de Gas:</span><div><span class="simbolo-linea" style="background:#d000ff;"></span> GPM (36" ENARSA)</div><div><span class="simbolo-linea" style="background:#0033cc;"></span> TGN</div><div><span class="simbolo-linea" style="background:#cc0000;"></span> TGS</div><div><span class="simbolo-punto" style="background:#000000; border-color:#ffffff;"></span> Compresoras</div><div><span class="simbolo-punto" style="background:#00ffff; border-color:#002060;"></span> Barcos GNL</div><div><span class="simbolo-punto" style="background:#d000ff; border-color:#ffffff;"></span> Peak Shaving</div></div>`;
        }
        if (document.getElementById('btn-sub-regiones-cammesa') && document.getElementById('btn-sub-regiones-cammesa').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">CAMMESA:</span><div><span class="simbolo-dash" style="color:#ffd700;"></span> Regiones Eléctricas SADI</div></div>`;
        }
        if (document.getElementById('btn-zee') && document.getElementById('btn-zee').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Espacios Marítimos:</span><div><span class="simbolo-linea" style="background:#ff2a2a;"></span> Mar Territorial (12 MN)</div><div><span class="simbolo-dash" style="color:#ffcc00;"></span> ZEE (200 MN)</div><div><span class="simbolo-dash" style="color:#00ffcc;"></span> Plataforma Ext.</div></div>`;
        }
        if (document.getElementById('btn-sub-trenes') && document.getElementById('btn-sub-trenes').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Logística Ferroviaria:</span><div><span class="simbolo-linea" style="background:#ff2a2a;"></span> Corredor Estratégico (Nivel 1)</div><div><span class="simbolo-dash" style="color:#e6194b;"></span> Belgrano</div><div><span class="simbolo-dash" style="color:#4363d8;"></span> San Martín</div><div><span class="simbolo-dash" style="color:#3cb44b;"></span> Urquiza</div><div><span class="simbolo-dash" style="color:#ffe119;"></span> Roca</div><div><span class="simbolo-dash" style="color:#42d4f4;"></span> Mitre</div></div>`;
        }
        if (document.getElementById('btn-sub-rutas-nac') && document.getElementById('btn-sub-rutas-nac').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Red Vial Nacional:</span><div><span class="simbolo-linea" style="background:#ffaa00;"></span> Corredor Estratégico (Nivel 1)</div><div><span class="simbolo-linea" style="background:#e0e8f0;"></span> Red Secundaria (Nivel 2)</div></div>`;
        }
        if (document.getElementById('btn-sub-rutas-prov') && document.getElementById('btn-sub-rutas-prov').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Red Vial Provincial:</span><div><span class="simbolo-linea" style="background:#99aab5;"></span> Capilaridad Regional (Nivel 2)</div></div>`;
        }
        if (document.getElementById('btn-industrias') && document.getElementById('btn-industrias').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Matriz Industrial:</span><div><span class="simbolo-punto" style="background:#ffd700; border-color:#ff2a2a;"></span> Planta Estratégica (Nivel 1)</div><div><span class="simbolo-punto" style="background:#00c8ff;"></span> Polo / Parque Industrial</div><div><span class="simbolo-punto" style="background:#cccccc;"></span> Establecimiento (Nivel 2)</div></div>`;
        }
        if (document.getElementById('btn-sub-metaliferos') && document.getElementById('btn-sub-metaliferos').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Minería Metalífera:</span><div><span class="simbolo-punto" style="background:#ffd700; border-color:#ff2a2a;"></span> Megayacimiento / Litio (Nivel 1)</div><div><span class="simbolo-punto" style="background:#ffaa00;"></span> Depósito Metalífero (Nivel 2)</div></div>`;
        }
        if (document.getElementById('btn-sub-industriales') && document.getElementById('btn-sub-industriales').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Minerales Industriales:</span><div><span class="simbolo-punto" style="background:#ffd700; border-color:#ff2a2a;"></span> Yacimiento Estratégico (Nivel 1)</div><div><span class="simbolo-punto" style="background:#aaaaaa; border-color:#ffffff;"></span> Cantera / Depósito (Nivel 2)</div></div>`;
        }
        if (document.getElementById('btn-sub-fibra') && document.getElementById('btn-sub-fibra').classList.contains('activo')) {
            contenidoHTML += `<div class="leyenda-grupo"><span class="leyenda-titulo">Telecomunicaciones:</span><div><span class="simbolo-linea" style="background:#00ffff; box-shadow: 0 0 5px #0088ff;"></span> Fibra Óptica Nivel 1</div></div>`;
        }

        const ejercitoActivo = document.getElementById('btn-fuerzas') && document.getElementById('btn-fuerzas').classList.contains('activo');
        const armadaActiva = document.getElementById('btn-armada') && document.getElementById('btn-armada').classList.contains('activo');
        
        // Verificación directa sobre la capa real del mapa para evitar falsos positivos
        const capaFaaVisible = map.getLayer('capa-fuerza-aerea') && map.getLayoutProperty('capa-fuerza-aerea', 'visibility') === 'visible';
        const capaRadaresVisible = map.getLayer('capa-sinvica-cobertura') && map.getLayoutProperty('capa-sinvica-cobertura', 'visibility') === 'visible';
        
        const faaActiva = capaFaaVisible;

    // Rastrea automáticamente qué capa abrió el Hub derecho sin tocar los 35 eventos individuales
    (function vincularRastreoCapasPanel() {
        const originalMapOn = map.on.bind(map);
        map.on = function(type, layerOrListener, listener) {
            if (type === 'click' && typeof listener === 'function' && layerOrListener) {
                const wrapped = function(e) {
                    const capaClick = (e && e.features && e.features[0] && e.features[0].layer && e.features[0].layer.id)
                        || (Array.isArray(layerOrListener) ? layerOrListener[0] : layerOrListener);
                    const panelEl = document.getElementById('panel-derecho');
                    const htmlPrevio = panelEl ? panelEl.innerHTML : '';
                    let disparoAccion = false;

                    const origFetch = window.fetch;
                    window.fetch = function() {
                        disparoAccion = true;
                        return origFetch.apply(this, arguments);
                    };

                    try {
                        const resultado = listener.apply(this, arguments);
                        const htmlNuevo = panelEl ? panelEl.innerHTML : '';
                        if (disparoAccion || htmlNuevo !== htmlPrevio) {
                            window.capaActivaPanelDerecho = capaClick;
                            if (!document.body.classList.contains('modo-wargame-activo')) {
                                window.ultimaCapaModoLibre = capaClick;
                            }
                        }
                        return resultado;
                    } finally {
                        window.fetch = origFetch;
                    }
                };
                return originalMapOn(type, layerOrListener, wrapped);
            }
            return originalMapOn(type, layerOrListener, listener);
        };
    })();

    function configurarBoton(idBoton, idsCapas) {
        const boton = document.getElementById(idBoton);
        if (!boton) return;

        // Registra las capas reales de este botón para los Teatros de Seguridad
        REGISTRO_CAPAS_BOTONES[idBoton] = idsCapas;

        if (boton.classList.contains('activo')) {
            idsCapas.forEach(idCapa => {
                if (map.getLayer(idCapa)) map.setLayoutProperty(idCapa, 'visibility', 'visible');
            });
        }

        boton.addEventListener('click', (e) => {
            e.stopPropagation();
            const activar = !boton.classList.contains('activo');
            boton.classList.toggle('activo', activar);
            const visibilidad = activar ? 'visible' : 'none';

            idsCapas.forEach(idCapa => {
                if (map.getLayer(idCapa)) map.setLayoutProperty(idCapa, 'visibility', visibilidad);
            });

            // SI SE APAGA EL BOTÓN: Cierra su Hub derecho si pertenecía a esta capa y limpia estados asociados
            if (!activar) {
                const capaAbierta = window.capaActivaPanelDerecho || window.ultimaCapaModoLibre;
                if (capaAbierta && idsCapas.includes(capaAbierta)) {
                    cerrarPanelIntel();

                // Limpieza adicional si se apaga Provincias
                if (idBoton === 'btn-limite') {

    function vincularSubmenu(idBotonPrincipal, idSubmenu) {
        const btn = document.getElementById(idBotonPrincipal);

        if (!btn || !sub) return;

        function acomodarSubmenu() {
            if (sub.classList.contains('abierto')) {
                const rect = btn.getBoundingClientRect();
                let posicionTop = rect.top;
                const alturaPantalla = window.innerHeight;
                const alturaCuadro = sub.offsetHeight;

                if ((posicionTop + alturaCuadro) > alturaPantalla - 15) {
                    posicionTop = alturaPantalla - alturaCuadro - 15;
                }
                if (posicionTop < 50) {
                    posicionTop = 50;
                }
                sub.style.top = posicionTop + 'px';
            }
        }

        document.getElementById('hud-lateral-izquierdo').addEventListener('scroll', acomodarSubmenu);

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const estabaAbierto = sub.classList.contains('abierto');

            // 1. Cierra inmediatamente todos los demás submenús flotantes
            document.querySelectorAll('.submenu-flotante').forEach(otroSub => {
                otroSub.classList.remove('abierto');
            });

            // 2. Abre el submenú actual solo si estaba cerrado
            if (!estabaAbierto) {
                sub.classList.add('abierto');
                acomodarSubmenu();
            }

            // 3. Actualiza el resaltado de los botones padre
            sincronizarBotonesPadre();
        });
    }

    async function obtenerInteligenciaBoveda(tabla, identificador, panel, colorHex, titulo) {
        panel.innerHTML = `<div style="color: ${colorHex}; text-align: center; margin-top:20px; font-weight: bold;">ENLAZANDO CON BÓVEDA ARKUS...</div>`;
        panel.classList.add('visible');
        try {
            const respuesta = await fetch(`/api/arkus/${tabla}/${encodeURIComponent(identificador)}`); const datos = await respuesta.json();
            if (datos.error) throw new Error(datos.error);
            return datos; 
        } catch (error) { panel.innerHTML = `<button class="btn-cerrar" onclick="cerrarPanelIntel()">✖</button><div style="color: red; margin-top: 20px;">Fallo de enlace: ${error.message}</div>`; return null; }

        document.head.appendChild(estiloHubDerecho);

        // =====================================================================
        // BLINDAJE DE RADARES, JERARQUÍA INDEPENDIENTE Y RETORNO AL HUB
        // =====================================================================
        const FILTRO_RADARES_NORTE = ['in', 'nombre', 'Escuadrón VYCA Resistencia', 'Sitio Radar Tostado'];
        const CAPAS_RADARES_SINVICA = [
            'capa-sinvica-cobertura', 'capa-sinvica-anillo',
            'capa-sinvica-destacado', 'capa-sinvica-antena'
        ];

        // 1. Impide que los anillos circulares de los 2 radares desaparezcan al tocar el mapa o un radar en Escudo Norte
        const originalSetFilter = map.setFilter.bind(map);
        map.setFilter = function(layerId, filter, options) {
            const norteActivo = document.getElementById('btn-escenario-norte')?.classList.contains('activo');
            if (norteActivo && CAPAS_RADARES_SINVICA.includes(layerId)) {
                return originalSetFilter(layerId, FILTRO_RADARES_NORTE, options);
            }
            return originalSetFilter(layerId, filter, options);
        };

        // 2. Interceptor en fase de captura: separa 100% Escudo Norte de Teatro Austral y frena clics en capas de fondo
        map.getCanvas().addEventListener('click', (ev) => {
            const norteActivo = document.getElementById('btn-escenario-norte')?.classList.contains('activo');
            const australActivo = document.getElementById('btn-escenario-austral')?.classList.contains('activo');
            if (!norteActivo && !australActivo) return;

            const rect = map.getCanvas().getBoundingClientRect();
            const pt = [ev.clientX - rect.left, ev.clientY - rect.top];
            const bbox = [[pt[0] - 8, pt[1] - 8], [pt[0] + 8, pt[1] + 8]];

            if (norteActivo && map.getLayer('capa-tai-punto')) {
                const hitsNorte = map.queryRenderedFeatures(bbox, { layers: ['capa-tai-punto', 'capa-tai-halo'] });
                if (hitsNorte && hitsNorte.length > 0) {
                    ev.stopImmediatePropagation();
                    ev.stopPropagation();
                    originalSetFilter('provincia-resaltado', ['==', 'nam', '']);
                    document.getElementById('hud-barra-superior').innerHTML = memoriaHTMLArgentina;
                    window.renderizarFaseWargameNorte(window.faseActualNorte || 1, false);
                    return;
                }
            }

            if (australActivo && map.getLayer('capa-wargame-punto')) {
                const hitsAustral = map.queryRenderedFeatures(bbox, { layers: ['capa-wargame-punto', 'capa-wargame-halo'] });
                if (hitsAustral && hitsAustral.length > 0) {
                    ev.stopImmediatePropagation();
                    ev.stopPropagation();
                    originalSetFilter('provincia-resaltado', ['==', 'nam', '']);
                    document.getElementById('hud-barra-superior').innerHTML = memoriaHTMLArgentina;
                    window.renderizarFaseWargame(window.faseActualAustral || 1, false);
                    return;
                }
            }
        }, true);

        // Fotos locales desde tu carpeta Img/
        const IMG_RADAR_ATUCHA  = "Img/atucha.jpg";
        const IMG_F16_FAA       = "Img/f16.jpg";

        function bloqueImagenPalantir(url, etiquetaSuperior, pieDeFoto, colorBorde) {
            return `
                <div style="position:relative; width:100%; margin-bottom:14px; border:1px solid ${colorBorde}; background:#050a10; overflow:hidden; border-radius:3px; box-shadow: 0 0 12px rgba(0,0,0,0.6); flex-shrink:0 !important;">
                    <div style="position:absolute; top:6px; left:6px; background:rgba(5,10,16,0.88); padding:2px 7px; border-left:2px solid ${colorBorde}; font-size:9.5px; color:${colorBorde}; font-family:monospace; letter-spacing:1px; z-index:2;">

        // =====================================================================
        // MEMORIA DE CAPAS + MEMORIA DEL HUB DERECHO Y BARRA SUPERIOR

        let memoriaBotonesPrevios = [];
        let memoriaHubDerecho = null;

        function guardarEstadoPrevioCapas() {
            const norteActivo = document.getElementById('btn-escenario-norte')?.classList.contains('activo');
            const australActivo = document.getElementById('btn-escenario-austral')?.classList.contains('activo');

            // Solo guarda la foto si el usuario viene del modo libre (no al saltar de un teatro a otro)
            if (!norteActivo && !australActivo) {
                memoriaBotonesPrevios = Object.keys(REGISTRO_CAPAS_BOTONES).filter(idBoton => {
                    const el = document.getElementById(idBoton);
                    return el && el.classList.contains('activo');

                const panelEl = document.getElementById('panel-derecho');
                const barraEl = document.getElementById('hud-barra-superior');

                memoriaHubDerecho = {
                    visible: panelEl ? panelEl.classList.contains('visible') : false,
                    html: panelEl ? panelEl.innerHTML : '',
                    scrollTop: panelEl ? panelEl.scrollTop : 0,
                    barraHTML: barraEl ? barraEl.innerHTML : memoriaHTMLArgentina,
                    filtroProvincia: map.getLayer('provincia-resaltado') ? map.getFilter('provincia-resaltado') : ['==', 'nam', ''],
                    filtroRadar: map.getLayer('capa-sinvica-destacado') ? map.getFilter('capa-sinvica-destacado') : ['==', 'nombre', ''],
                    filtrosPaises: paisesVecinos.map(p => ({

                    if (map.getLayer(idCapa)) {

                    }
                });

            ['capa-tai-amenaza', 'capa-tai-scramble', 'capa-tai-escolta', 'capa-tai-halo', 'capa-tai-punto',
             'capa-wargame-halo', 'capa-wargame-punto', 'capa-wargame-escape'].forEach(id => {

                    try { map.setLayoutProperty(id, 'visibility', 'none'); } catch (e) {}

                }

                try { originalSetFilter('capa-fuerza-aerea', ['==', ['get', 'fuerza'], 'Fuerza Aérea']); } catch (e) {}
            }
            if (map.getLayer('capa-sinvica-destacado')) {
                try { originalSetFilter('capa-sinvica-destacado', ['==', 'nombre', '']); } catch (e) {}
            }

            memoriaBotonesPrevios.forEach(idBoton => {
                const btn = document.getElementById(idBoton);
                const idsCapas = REGISTRO_CAPAS_BOTONES[idBoton];
                if (btn && idsCapas) {
                    btn.classList.add('activo');
                    idsCapas.forEach(idCapa => {
                        if (map.getLayer(idCapa)) {
                            try { map.setLayoutProperty(idCapa, 'visibility', 'visible'); } catch (e) {}
                        }
                    });
                }
            });
            memoriaBotonesPrevios = [];

            // Restaura el Hub Derecho, la Barra Superior y los resaltados previos si existían
            if (memoriaHubDerecho) {
                const panelEl = document.getElementById('panel-derecho');
                const barraEl = document.getElementById('hud-barra-superior');

                if (barraEl && memoriaHubDerecho.barraHTML) {
                    barraEl.innerHTML = memoriaHubDerecho.barraHTML;
                }
                if (map.getLayer('provincia-resaltado') && memoriaHubDerecho.filtroProvincia) {
                    try { originalSetFilter('provincia-resaltado', memoriaHubDerecho.filtroProvincia); } catch (e) {}
                }
                if (map.getLayer('capa-sinvica-destacado') && memoriaHubDerecho.filtroRadar) {
                    try { originalSetFilter('capa-sinvica-destacado', memoriaHubDerecho.filtroRadar); } catch (e) {}
                }
                if (Array.isArray(memoriaHubDerecho.filtrosPaises)) {
                    memoriaHubDerecho.filtrosPaises.forEach(fp => {
                        if (map.getLayer(fp.id) && fp.filtro) {
                            try { originalSetFilter(fp.id, fp.filtro); } catch (e) {}
                        }
                    });

                if (panelEl) {
                    if (memoriaHubDerecho.visible && memoriaHubDerecho.html) {
                        panelEl.innerHTML = memoriaHubDerecho.html;
                        panelEl.classList.add('visible');

                        panelEl.classList.remove('visible');

                memoriaHubDerecho = null;

        function aplicarFiltroInteligente(layerId, sourceId, palabraClave) {
            if (!map.getLayer(layerId)) return;
            map.setLayoutProperty(layerId, 'visibility', 'visible');
            
            const textoBusqueda = ['downcase', ['to-string', ['coalesce', ['get', 'nombre_clave'], ['get', 'Nombre'], ['get', 'nombre'], ['get', 'fna'], ['get', 'nam'], '']]];
            const condicionNombre = ['!=', ['index-of', palabraClave.toLowerCase(), textoBusqueda], -1];

            if (layerId === 'capa-fuerza-aerea') {
                originalSetFilter(layerId, ['all', ['==', ['get', 'fuerza'], 'Fuerza Aérea'], condicionNombre]);
            } else {
                originalSetFilter(layerId, condicionNombre);
            }
        }

                    ${bloqueImagenPalantir(
                        IMG_F16_FAA,
                        "CAZA INTERCEPTOR: F-16 FIGHTING FALCON DESPEGANDO DE LA BASE AÉREA RÍO CUARTO (FAA)",
                        "CONTACTO VISUAL POSITIVO: Intruso interceptado en pleno vuelo",
                        "#00e5ff"
                    )}

                    <div class="intel-parrafo" style="font-size: 13px; border-left: 2px solid #00e5ff; padding-left: 10px; margin-bottom: 14px;">
                        Como el asunto es de <strong>alta urgencia y un gran riesgo para la infraestructura crítica del país</strong>, se envió un avión interceptor <strong>(F-16) de la Base Aérea de Río Cuarto</strong>.<br><br>
                        El F-16 logra establecer comunicación con el intruso y, ante las <strong>sospechas de sus intenciones</strong>, se procede a escoltarlo hacia el <strong>Aeropuerto de Santa Fe</strong>:
                    </div>

                    <!-- BOTÓN CLICKEABLE PARA ATERRIZAR EN SANTA FE -->
                    <div class="coa-card" onclick="renderizarFaseWargameNorte(4)" style="background: rgba(0, 255, 136, 0.18); border: 1px solid #00ff88; border-left: 5px solid #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.25);">
                        <strong style="color: #00ff88; font-size: 13.5px;">ESCOLTAR AL AEROPUERTO DE SANTA FE (INTERVENCIÓN PSA)</strong><br>
                        <span style="color: #ffffff; font-size: 12px;">Hacer aterrizar al intruso donde lo espera la Policía de Seguridad Aeroportuaria.</span>
                    </div>

                    <div onclick="renderizarFaseWargameNorte(1)" style="cursor:pointer; text-align:center; color:#a0aab5; font-size:11px; text-decoration:underline; margin-top:8px;">
                        ◂ Volver al inicio del escenario
                    </div>
                `;
            }

            // FASE 4: ATERRIZAJE EN SANTA FE + FOTO DE LA PSA + ARRESTO POR NARCOTRÁFICO
            else if (fase === 4) {
                asegurarVisibilidadPuntosNorte(true);
                if (map.getLayer('capa-tai-escolta')) {
                    map.setLayoutProperty('capa-tai-escolta', 'visibility', 'visible');
                    map.setLayoutProperty('capa-tai-amenaza', 'visibility', 'none');
                    map.setPaintProperty('capa-tai-punto', 'circle-color', '#00ff88');
                    map.setPaintProperty('capa-tai-halo', 'circle-color', '#00ff88');
                }
                if (map.getLayer('capa-aeropuertos')) {
                    aplicarFiltroInteligente('capa-aeropuertos', 'ign-aeropuertos', 'Sauce Viejo');
                    const bAero = document.getElementById('btn-sub-aeropuertos');
                    if (bAero) bAero.classList.add('activo');
                    if (typeof sincronizarBotonesPadre === 'function') sincronizarBotonesPadre();
                }

                if (moverCamara) {
                    map.flyTo({ center: COORDS_AERO_SANTA_FE, zoom: 6.3, pitch: 40, speed: 0.9 });
                }

                panel.innerHTML = `
                    <button class="btn-cerrar" onclick="cerrarPanelIntel()">✖</button>
                    <h2 class="intel-titulo" style="color: #00ff88; margin-bottom: 8px;">Amenaza Neutralizada</h2>
                    <div style="margin-bottom: 10px; padding: 8px 10px; background: rgba(0, 255, 136, 0.15); border: 1px solid rgba(0,255,136,0.4); border-left: 4px solid #00ff88;">
                        <span style="color: #00ff88; font-weight: bold; font-size: 11.5px;">OPERATIVO EXITOSO</span>
                    </div>

                    ${bloqueImagenPalantir(
                        IMG_PSA_OPERATIVO,
                        "POLICÍA DE SEGURIDAD AEROPORTUARIA (PSA)",
                        "AEROPUERTO DE SANTA FE: Sustancias ilícitas incautadas y piloto detenido",
                        "#00ff88"
                    )}

                    <div class="intel-parrafo" style="font-size: 13px; line-height: 1.5; border-left: 2px solid #00ff88; padding-left: 10px; margin-bottom: 12px;">
                        <strong>RESULTADO DEL OPERATIVO:</strong><br>
                        El avión aterriza bajo escolta del F-16 en el <strong>Aeropuerto de Santa Fe</strong>, donde lo esperaba la <strong>Policía de Seguridad Aeroportuaria (PSA)</strong> para su interrogación.<br><br>
                        Al requisar la aeronave, la PSA descubre que transportaba <strong>varios kilogramos de sustancias ilícitas</strong> y como consecuencia se procede al <strong>arresto del piloto por tráfico de drogas</strong>.<br><br>
                        <strong style="color:#00ff88;">¡Logramos defender nuestra soberanía con éxito!</strong>
                    </div>

                    <div class="coa-card" onclick="renderizarFaseWargameNorte(1)" style="text-align:center; background: rgba(0, 200, 255, 0.12); border: 1px solid #00c8ff;">
                        <strong style="color: #00c8ff; font-size: 12px;">REINICIAR SIMULACIÓN ESCUDO NORTE</strong>
                    </div>
                `;
            }
        };

        // -------------------------------------------------------------------------
        // 2. SIMULACIÓN TEATRO AUSTRAL (OPCIONES CLICKEABLES + FOTOS + ZEE)
        // -------------------------------------------------------------------------
        const COORDS_INCIDENTE_MEDWAY = [-61.85, -46.80];

        function inicializarCapasWargameAustral() {
            if (map.getSource('fuente-wargame-austral')) return;

            map.addSource('fuente-wargame-austral', {
                type: 'geojson',
                data: {
                    "type": "FeatureCollection",
                    "features": [{
                        "type": "Feature",
                        "properties": { "id": "INC-2026-SO", "nombre": "CONTACTO: HMS Medway (P223) / P-3C Orion (6-P-57)" },
                        "geometry": { "type": "Point", "coordinates": COORDS_INCIDENTE_MEDWAY }
                    }]
                }
            });

            map.addSource('fuente-wargame-escape', {
                type: 'geojson',
                data: {
                    "type": "FeatureCollection",
                    "features": [{
                        "type": "Feature",
                        "properties": {},
                        "geometry": { "type": "LineString", "coordinates": [COORDS_INCIDENTE_MEDWAY, [-59.50, -47.20]] }
                    }]
                }
            });

            map.addLayer({
                'id': 'capa-wargame-halo', 'type': 'circle', 'source': 'fuente-wargame-austral',
                'layout': { 'visibility': 'none' },
                'paint': { 'circle-radius': 22, 'circle-color': '#ffcc00', 'circle-opacity': 0.28, 'circle-stroke-width': 1.5, 'circle-stroke-color': '#ffcc00' }
            });
            map.addLayer({
                'id': 'capa-wargame-escape', 'type': 'line', 'source': 'fuente-wargame-escape',
                'layout': { 'visibility': 'none' },
                'paint': { 'line-color': '#00ff88', 'line-width': 2.5, 'line-dasharray': [3, 2] }
            });
            map.addLayer({
                'id': 'capa-wargame-punto', 'type': 'circle', 'source': 'fuente-wargame-austral',
                'layout': { 'visibility': 'none' },
                'paint': { 'circle-radius': 9, 'circle-color': '#ffcc00', 'circle-stroke-width': 2.5, 'circle-stroke-color': '#000000' }
            });

            map.on('mouseenter', ['capa-wargame-punto', 'capa-wargame-halo'], () => { map.getCanvas().style.cursor = 'crosshair'; });
            map.on('mouseleave', ['capa-wargame-punto', 'capa-wargame-halo'], () => { map.getCanvas().style.cursor = ''; });
        }

        window.faseActualAustral = 1;
        window.renderizarFaseWargame = function(fase, moverCamara = true) {
            if (!document.getElementById('btn-escenario-austral')?.classList.contains('activo')) return;

            window.faseActualAustral = fase;
            const panel = document.getElementById('panel-derecho');
            panel.classList.add('visible');
            panel.scrollTop = 0;

            if (fase === 1) {
                if (map.getLayer('capa-wargame-punto')) {
                    map.setPaintProperty('capa-wargame-punto', 'circle-color', '#ffcc00');
                    map.setPaintProperty('capa-wargame-halo', 'circle-color', '#ffcc00');
                    map.setLayoutProperty('capa-wargame-escape', 'visibility', 'none');
                }
                panel.innerHTML = `
                    <button class="btn-cerrar" onclick="cerrarPanelIntel()">✖</button>
                    <h2 class="intel-titulo" style="color: #ffcc00; margin-bottom: 8px;">Incidente Táctico en ZEE</h2>
                    <div style="margin-bottom: 10px; padding: 7px 10px; background: rgba(255, 204, 0, 0.12); border-left: 3px solid #ffcc00;">
                        <span style="color: #ffcc00; font-weight: bold; font-size: 11px;">ALERTA C4ISR | SECTOR MALVINAS NOROESTE</span>
                    </div>

                    ${bloqueImagenPalantir(
                        IMG_HMS_MEDWAY,
                        "CONTACTO VISUAL: BUQUE BRITÁNICO HMS MEDWAY (P223)",
                        "PATRULLAJE MAR ARGENTINO: Incursión detectada dentro de la ZEE",
                        "#ffcc00"
                    )}

                    <div class="intel-parrafo" style="font-size: 12.8px; margin-bottom: 12px; border-left: 2px solid #ffcc00; padding-left: 10px;">
                        Un <strong>P-3C Orion</strong> de la Armada Argentina en su patrullaje de rutina por el Mar Argentino tuvo contacto visual con el buque británico <strong>HMS Medway</strong>, que entró en la Zona Económica Exclusiva de nuestro país.<br><br>
                        <strong style="color:#00c8ff;">ACCIONES RECOMENDADAS (SELECCIONE UNA OPCIÓN):</strong>
                    </div>

                    <!-- OPCIÓN CLICKEABLE 1 -->
                    <div class="coa-card" onclick="renderizarFaseWargame(2)" style="background: rgba(0, 200, 255, 0.12); border: 1px solid rgba(0, 200, 255, 0.45); border-left: 4px solid #00c8ff;">
                        <strong style="color: #00c8ff; font-size: 13px;">▸ OPCIÓN 1: Intentar comunicación con el buque</strong><br>
                        <span style="color: #e0e8f0; font-size: 12px;">Emitir requerimiento radial por VHF Canal 16 exigiendo su retiro de la ZEE.</span>
                    </div>

                    <!-- OPCIÓN CLICKEABLE 2 -->
                    <div class="coa-card" onclick="renderizarFaseWargame(4)" style="background: rgba(255, 170, 0, 0.12); border: 1px solid rgba(255, 170, 0, 0.45); border-left: 4px solid #ffaa00;">
                        <strong style="color: #ffaa00; font-size: 13px;">▸ OPCIÓN 2: Presionar y enviar señales visuales con el P-3C Orion</strong><br>
                        <span style="color: #e0e8f0; font-size: 12px;">Maniobras a baja altitud y señales visuales para que cambie de curso inmediatamente.</span>
                    </div>

                    <!-- OPCIÓN CLICKEABLE 3 -->
                    <div class="coa-card" onclick="renderizarFaseWargame(3)" style="background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.25); border-left: 4px solid #a0aab5;">
                        <strong style="color: #ffffff; font-size: 13px;">▸ OPCIÓN 3: Enviar un patrullero oceánico del continente</strong><br>
                        <span style="color: #a0aab5; font-size: 12px;">Envía un patrullero oceánico desde la Base Naval Mar del Plata en el continente.</span>
                    </div>
                `;
            } else if (fase === 2) {
                panel.innerHTML = `
                    <button class="btn-cerrar" onclick="cerrarPanelIntel()">✖</button>
                    <h2 class="intel-titulo" style="color: #ff4444; margin-bottom: 10px;">Comunicación sin Resultado</h2>
                    <div style="margin-bottom: 12px; padding: 10px; background: rgba(255, 42, 42, 0.15); border-left: 3px solid #ff2a2a; font-size: 12.5px;">
                        <strong style="color: #ff4444;">SILENCIO DE RADIO:</strong><br>
                        La comunicación con el buque <strong>HMS Medway</strong> no dio resultado.
                    </div>
                    <div style="margin-bottom: 14px; padding: 10px; background: rgba(255, 170, 0, 0.12); border-left: 3px solid #ffaa00; font-size: 12.5px;">
                        <strong style="color: #ffaa00;">DESCARTADO PATRULLERO DEL CONTINENTE:</strong><br>
                        Enviar un patrullero del continente resulta en <strong>mucho tiempo que es vital</strong> para esta situación.
                    </div>

                    <div class="coa-card" onclick="renderizarFaseWargame(4)" style="background: rgba(0, 255, 136, 0.16); border: 1px solid #00ff88; border-left: 5px solid #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.25);">
                        <strong style="color: #00ff88; font-size: 13.5px;">HACER SEÑALES VISUALES CON EL P-3C ORION</strong><br>
                        <span style="color: #ffffff; font-size: 12px;">Presionar al buque para que cambie de curso inmediatamente.</span>
                    </div>

                    <div onclick="renderizarFaseWargame(1)" style="cursor:pointer; text-align:center; color:#a0aab5; font-size:11px; text-decoration:underline; margin-top:10px;">
                        ◂ Volver a las opciones
                    </div>
                `;
            } else if (fase === 3) {
                panel.innerHTML = `
                    <button class="btn-cerrar" onclick="cerrarPanelIntel()">✖</button>
                    <h2 class="intel-titulo" style="color: #ffaa00; margin-bottom: 10px;">Demora Crítica (+11 hs)</h2>
                    <div style="margin-bottom: 14px; padding: 12px; background: rgba(255, 170, 0, 0.15); border-left: 3px solid #ffaa00; font-size: 13px;">
                        Enviar un patrullero oceánico desde las bases navales del continente resulta en <strong>mucho tiempo que es vital</strong> para esta situación. Se decide emplear al P-3C Orion en escena:
                    </div>
                    <div class="coa-card" onclick="renderizarFaseWargame(4)" style="background: rgba(0, 255, 136, 0.16); border: 1px solid #00ff88; border-left: 4px solid #00ff88;">
                        <strong style="color: #00ff88; font-size: 13px;">Ejecutar Señales Visuales con el P-3C Orion</strong>
                    </div>
                    <div onclick="renderizarFaseWargame(1)" style="cursor:pointer; text-align:center; color:#a0aab5; font-size:11px; text-decoration:underline; margin-top:10px;">
                        ◂ Volver a las opciones
                    </div>
                `;
            } else if (fase === 4) {
                if (map.getLayer('capa-wargame-punto')) {
                    map.setPaintProperty('capa-wargame-punto', 'circle-color', '#00ff88');
                    map.setPaintProperty('capa-wargame-halo', 'circle-color', '#00ff88');
                    map.setLayoutProperty('capa-wargame-escape', 'visibility', 'visible');
                }
                panel.innerHTML = `
                    <button class="btn-cerrar" onclick="cerrarPanelIntel()">✖</button>
                    <h2 class="intel-titulo" style="color: #00ff88; margin-bottom: 8px;">✔ Situación Resuelta</h2>
                    <div style="margin-bottom: 10px; padding: 8px 10px; background: rgba(0, 255, 136, 0.15); border: 1px solid rgba(0,255,136,0.4); border-left: 4px solid #00ff88;">
                        <span style="color: #00ff88; font-weight: bold; font-size: 12px;">SOBERANÍA MARÍTIMA DEFENDIDA</span>
                    </div>

                    ${bloqueImagenPalantir(
                        IMG_P3_ORION,
                        "P-3C ORION (ARMADA ARGENTINA)",
                        "SEÑALES VISUALES EFECTIVAS: El HMS Medway abandona la ZEE",
                        "#00ff88"
                    )}

                    <div class="intel-parrafo" style="font-size: 13px; line-height: 1.5; border-left: 2px solid #00ff88; padding-left: 10px; margin-bottom: 14px;">
                        <strong>RESULTADO FINAL:</strong><br>
                        Situación resuelta. Ante la presión y las señales visuales del <strong>P-3C Orion</strong>, el buque británico <strong>HMS Medway cambió de curso inmediatamente y salió de nuestra Zona Económica Exclusiva</strong>.<br><br>
                        <strong style="color:#00ff88;">¡Logramos defender la soberanía marítima de nuestro país!</strong>
                    </div>

                    <div class="coa-card" onclick="renderizarFaseWargame(1)" style="text-align:center; background: rgba(0, 200, 255, 0.12); border: 1px solid #00c8ff;">
                        <strong style="color: #00c8ff; font-size: 12px;">REINICIAR SIMULACIÓN TEATRO AUSTRAL</strong>
                    </div>
                `;
            }
        };

        const btnNorteEl = document.getElementById('btn-escenario-norte');
        const btnAustralEl = document.getElementById('btn-escenario-austral');

        if (btnNorteEl) {
            btnNorteEl.addEventListener('click', () => {
                inicializarCapasWargameNorte();
                const estabaActivo = btnNorteEl.classList.contains('activo');

                if (!estabaActivo) {
                    guardarEstadoPrevioCapas();
                    if (btnAustralEl) btnAustralEl.classList.remove('activo');
                    apagarTodasLasCapasMapa();
                    restaurarFiltrosModoLibre();

                    btnNorteEl.classList.add('activo');
                    document.body.classList.add('modo-wargame-activo');

                    activarCapasEscenario(
                        [
                            'provincia-relleno', 'borde-interprovincial', 'provincia-resaltado',
                            'capa-sinvica-cobertura', 'capa-sinvica-anillo', 'capa-sinvica-destacado', 'capa-sinvica-antena',
                            'capa-alta-tension', 'sadi-hitbox', 'capa-gen-electrica', 'capa-fuerza-aerea',
                            'capa-tai-amenaza', 'capa-tai-halo', 'capa-tai-punto'
                        ],
                        ['btn-limite', 'btn-sub-radares', 'btn-sub-gen-electrica', 'btn-sub-alta-tension', 'btn-sub-bases-aereas']
                    );

                    CAPAS_RADARES_SINVICA.forEach(id => {
                        if (map.getLayer(id)) {
                            try { originalSetFilter(id, FILTRO_RADARES_NORTE); } catch (e) {}
                        }
                    });

                    aplicarFiltroInteligente('capa-gen-electrica', 'sadi-generacion', 'Atucha');
                    aplicarFiltroInteligente('capa-fuerza-aerea', 'fuerzas-armadas', 'Cuarto');

                    map.flyTo({ center: [-60.5, -32.3], zoom: 6.2, pitch: 45, speed: 0.85 });
                    window.renderizarFaseWargameNorte(1, true);
                } else {
                    btnNorteEl.classList.remove('activo');
                    document.body.classList.remove('modo-wargame-activo');
                    apagarTodasLasCapasMapa();
                    restaurarFiltrosModoLibre();
                    restaurarCapasPreviasUsuario();
                    map.flyTo({ center: [-63.6167, -38.4161], zoom: 3.3, pitch: 20, speed: 1 });
                }
            });
        }

        if (btnAustralEl) {
            btnAustralEl.addEventListener('click', () => {
                inicializarCapasWargameAustral();
                const estabaActivo = btnAustralEl.classList.contains('activo');

                if (!estabaActivo) {
                    guardarEstadoPrevioCapas();
                    if (btnNorteEl) btnNorteEl.classList.remove('activo');
                    apagarTodasLasCapasMapa();
                    restaurarFiltrosModoLibre();

                    btnAustralEl.classList.add('activo');
                    document.body.classList.add('modo-wargame-activo');

                    activarCapasEscenario(
                        [
                            'provincia-relleno', 'borde-interprovincial', 'provincia-resaltado',
                            'zee-borde', 'mar-borde', 'plataforma-borde', 'zee-hitbox', 'mar-hitbox', 'plataforma-hitbox',
                            'capa-wargame-halo', 'capa-wargame-punto'
                        ],
                        ['btn-limite', 'btn-zee']
                    );

                    map.flyTo({ center: [-60.50, -46.80], zoom: 5.8, pitch: 45, speed: 0.85 });
                    window.renderizarFaseWargame(1, true);
                } else {
                    btnAustralEl.classList.remove('activo');
                    document.body.classList.remove('modo-wargame-activo');
                    apagarTodasLasCapasMapa();
                    restaurarFiltrosModoLibre();
                    restaurarCapasPreviasUsuario();
                    map.flyTo({ center: [-63.6167, -38.4161], zoom: 3.3, pitch: 20, speed: 1 });
                }
            });
        }
    })();
</script>
</body>
</html>
